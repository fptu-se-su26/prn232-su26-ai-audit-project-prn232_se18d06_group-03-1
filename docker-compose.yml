services:
  ai-verification:
    build:
      context: ./Src/ai-verification
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    env_file:
      - ./Src/ai-verification/.env
    networks:
      - movevn
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./Src/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - ./Src/backend/.env
    depends_on:
      ai-verification:
        condition: service_healthy
    networks:
      - movevn

networks:
  movevn:
    driver: bridge
